<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms to apply for web developmennt</title>
</head>

<body>
    <h1>Forms To apply on course of web development</h1>
    <div>
        <label for="Myself">Username</label>
        <input type="text" id="myself" name="username" placeholder="Enter your username">
    </div>

    <div>
        <label for="hello">Enter your password</label>
        <input type="password" id="hello" name="password" placeholder="Enter your password">
    </div>

    <div>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
    </div>
    <div>
        <input type="checkbox" id="subscribe" name="subscribe" value="yes">
        <label for="subscribe">Subscribe to newsletter</label>
    </div>
    <div>
        <label for="class">Coment Down</label>
        <br>
        <textarea id="class" name="comment" rows="4" cols="50"></textarea>
    </div>
 <div>
    <select name="fruits">
        <option value="apple">Apple</option>
        <option value="banana">Banana</option>
        <option value="cherry">Cherry</option>
  </select>
 </div>
</body>

</html>
