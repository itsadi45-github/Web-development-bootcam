<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            background-color: aqua;

        }

        .box1 {
            color: green;
            border: 4px solid black;
            height: 100px;
            box-sizing: border-box;
        }
        

        .box2 {
            color: green;
            border: 4px solid rgb(102, 19, 19);
            height: 100px;
            box-sizing: border-box;
            /* box-sizing: border-box; it said the height i have given it  includes the padding and border to the content not margin  */

        }
    </style>
</head>

<body>
    <div class="box box1">I am A Box1.</div>
    <div class="box box2">I am A Box2.</div>
</body>

</html>
