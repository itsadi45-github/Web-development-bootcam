<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Media Queries</title>
    <style>
        body {
            background-color: blueviolet;

        }

        /* @media screen and (orientation:landscape){
              body{
                border:3px solid rgb(30, 23, 23);
              }
            
        } */
        @media screen and (orientation:portrait) {
            body {
                border: 3px solid rgb(30, 23, 23);
            }

        }

        @media only screen and (max-width:800px) {
            body {

                background-color: rgb(28, 94, 94);

            }

            .boxes {
                flex-direction: column;
                /* It means when ever the device goo below 800px then row will changes into column */
            }
        }

        /* When ever the width of screen will be lessthan or equal to 800px then it will changes its background color */

        /* @media not|only mediatype and (expressions) {
            CSS-Code;
        } */
        /* @media only screen and (min-width:500px){
          body{ */
        /* When ever the width of screen will be graterthan or equal to  then it will changes its background color */
        /* background-color: rgb(7, 2, 147);
          }
        } */
        .boxes {
            display: flex;
        }

        .box {
            width: 344px;
            height: 244px;
            background-color: azure;
            padding: 3px;
            margin: 3px;
            border: 2px solid black;
        }
    </style>
</head>

<body>
    <div>
        hey i am a voilet body!

</body>

</html>
