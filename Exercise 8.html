<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise-8</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .container{
            position: relative;
            height: 80vh;
            width: 98vw;
            background-color: rgb(83, 134, 32);
        }
        .ball{
            height: 100px;
            width: 100px;
            background-color: rgb(255 0 0);
            border: 1px solid rgb(255 0 0);
            border-radius: 50px;
            position: absolute;
            bottom: 0;
            left: 0;
            /* animation: name duration timing-function delay iteration-count direction fill-mode; */
            animation: animatex 3s linear infinite,animatey 1s ease-out infinite alternate ;
            
        }
          @keyframes animatex {
             from{
                left: 0;
             }
            to{
                 left: 100%;
            }
        }
          @keyframes animatey {
             from{
                bottom: 0;
             }
            to{
                 bottom: 100%;
            }
          }
    </style>
</head>
<body>
    <div class="container">
        <div class="ball"></div>
    </div>
</body>
</html>
