<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Object-Fit and Object-Position</title>
    <style>
        .container {
            height: 60vh;
            width: 40vw;
            border: 2px solid black;
            background-color: burlywood;
        }

        img {
            height: 60vh;
            width: 40vw;
            object-fit: cover;
            /* object-fit:fill; */
            /* object-fit:scale-down; */
            /* object-position: top left; */
            object-position: 0px -4px;
            /*most usefull property*/
            /* object-fit: cover; it will show a image by cutting some portions  */
            /* object-fit: contain; */
            /* object-fit: contain; it will show the whole image as it is  */
        }

        .container2 {
            height: 488px;
            width: 466px;
            border: 2px solid black;
            background-position: bottom center;
            color: yellow;
            /* background-position: center center; */
            /* background-clip: border-box; */
            /* very less useful */
            /* background-image: url("https://us.123rf.com/450wm/progressman/progressman1909/progressman190900115/130695651-woman-in-black-coat-walking-along-the-sea.jpg?ver=6"); */
            background-image: url(https://png.pngtree.com/thumb_back/fh260/background/20200714/pngtree-modern-double-color-futuristic-neon-background-image_351866.jpg);
            /* if we put small image then it will repeat by default */
            /* background-repeat: no-repeat; */
            /*prevent from repetation of image at any axis*/
            /* background-repeat: repeat-x; */
            /*prevent from repetation of image at y-axis*/

            /* background-repeat: repeat-y; */
            /*prevent from repetation of image at x-axis*/

        }
    </style>
</head>

<body>
    <div class="container2">
        hey i am aditya
    </div><br><br>
    </div>
    <div class="container">
        <img src="https://images.shiksha.com/mediadata/images/articles/1568193656phpmWI2xq.jpeg" alt="image">

</body>

</html>
