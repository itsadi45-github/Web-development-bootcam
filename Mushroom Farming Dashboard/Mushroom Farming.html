<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mushroom-Farming-Dashboard</title>
    <link rel="stylesheet" href="mushroom farming.css">
</head>
<script src="mushroom.js"></script>
<body>
    <div class="container">
        <nav class="main_nav">
            <div class="nav_1">
            <div class="menu"><img src="menu.svg" alt=""></div>
            <div class="notification"><img src="notification.svg" alt=""></div>
            <div class="location"><img src="location.svg" alt=""></div>
            <p>Birgunj,&nbsp;Nepal</p>
        </div>
        <div class="nav_2">
            <input type="text" name="searchbar" id="search" placeholder="Search Date">
            <div id="lighting_modes"></div>
        </div>
        </nav>
        <div class="box_1">
            <nav>
                <p>Temperature</p>
                <p id="real_time">11:45 AM</p>
            </nav>
            <div class="cloude">
                <img src="cloude.svg" alt="">
            </div>
            <div id="Temperature"></div>
        </div>
        <div class="box_2">
            <nav>
                <p>Humidity</p>
                <p id="real_time"></p>
            </nav>
            <div class="rainy_cloude">
                <img src="rainysloude.svg" alt="">
            </div>
            <div id="Humidity"></div>
        </div>
        <div class="box_3">
            <nav>
                <p>Illumination Level</p>
            </nav>
            <div id="Illumination"></div>
        </div>
    </div>

</body>
</html>
