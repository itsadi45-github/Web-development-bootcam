<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Proporties</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            border: 3px solid orangered;
            display: inline-block;
            /* It makes our block element to inline elements */
            /* display: inline; */
            /* If We will use this only then our padding and margin and Width from the top doesn't work  */
            padding: 50px;
            margin: 50px;
            width: 200px;
        }

        .box1 {
            /* display: none; if we use this there will show empty on our web sites */
            /* visibility: hidden; if wee use this the selected content will be invisible bt there will  be space for invisible content  */
        }
    </style>
</head>

<body>
    <div class="box">
        This is a box.
    </div>
    <div class="box box1"> and also a nice box,</div>
    <span>He is a good</span>
    <span>BoY</span>
       
</body>

</html>
